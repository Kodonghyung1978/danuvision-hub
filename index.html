  function bindProjectDocsSection(project) {
    const refresh = () => renderProjectDetail(project.id);
    document.getElementById('pdAddDocBtn').addEventListener('click', () => { projDocFormOpen = true; refresh(); });
    document.querySelectorAll('#pdDocList .doc-list-item-row[data-id]').forEach(row => row.addEventListener('click', e => {
      if (e.target.closest('.doc-item-actions')) return;
      projDocExpandedId = projDocExpandedId === row.dataset.id ? null : row.dataset.id;
      refresh();
    }));
    document.querySelectorAll('.pdDocRemove').forEach(b => b.addEventListener('click', () => {
      detachDocFromProject(project.id, b.dataset.id);
      if (projDocExpandedId === b.dataset.id) projDocExpandedId = null;
      saveLS(); saveProjectMeta();
      refresh();
    }));
    document.getElementById('pdDocLinkBtn').addEventListener('click', () => {
      const inp = document.getElementById('pdDocHash');
      if (!inp.value.trim()) return;
      const doc = findDocByHash(inp.value);
      if (!doc) { toast('해당 코드의 자료를 찾을 수 없습니다'); return; }
      if (!attachDocToProject(project.id, doc.id)) { toast('이미 연결된 자료입니다'); return; }
      saveLS(); saveProjectMeta();
      toast('자료가 연결되었습니다');
      refresh();
    });
    bindDocThumbEditable('#pdDocList', refresh);
    bindDocFieldsEditable('#pdDocList');
    bindDocLinkedTaskLinks('#pdDocList');
    bindDocLinkedProjectLinks('#pdDocList');
    if (!projDocFormOpen) return;
    let newDocType = 'file';
    const typeFileBtn = document.getElementById('pdDocTypeFile');
    const typeMailBtn = document.getElementById('pdDocTypeMail');
    typeFileBtn.addEventListener('click', () => { newDocType = 'file'; typeFileBtn.classList.add('active'); typeMailBtn.classList.remove('active'); });
    typeMailBtn.addEventListener('click', () => { newDocType = 'mail'; typeMailBtn.classList.add('active'); typeFileBtn.classList.remove('active'); });
    const newDocThumb = setupThumbPasteZone('pdDocNewThumbZone', 'pdDocNewThumbWrap', 'pdDocNewThumbImg', 'pdDocNewThumbClear');
    document.getElementById('pdDocNewCancel').addEventListener('click', () => { projDocFormOpen = false; refresh(); });
    document.getElementById('pdDocNewSave').addEventListener('click', () => {
      const dTitleRaw = document.getElementById('pdDocNewTitle').value.trim();
      const dUrl = document.getElementById('pdDocNewUrl').value.trim();
      if (newDocType === 'mail' && !dUrl) { toast('메일 링크 URL을 입력하세요'); return; }
      if (newDocType === 'file' && !dTitleRaw) { toast('자료명을 입력하세요'); return; }
      const did = uid();
      store.documents[did] = { id: did, hash: genDocHash(), title: dTitleRaw || (newDocType === 'mail' ? '메일 링크' : ''), type: newDocType, category: '', description: '', url: dUrl, thumbnail: newDocThumb.get(), createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
      attachDocToProject(project.id, did);
      saveLS(); saveConfig(); saveProjectMeta();
      projDocFormOpen = false;
      toast('자료가 추가되었습니다');
      refresh();
    });
  }

  // 프로젝트에 연결된 자료 관리 — 업무 모달의 "관련 자료" 섹션과 동일한 패턴
  function showProjectDocsModal(project) {
    if (!project) return;
    openModal(`프로젝트 자료 — ${esc(project.name)}`, `
      <div id="pDocList" style="margin-bottom:8px"></div>
      <div style="display:flex;gap:6px;margin-bottom:6px">
        <input class="form-input" id="pDocHash" placeholder="다른 프로젝트/업무 자료 연결 코드 입력 (예: 3F9K2A)" style="flex:1">
        <button type="button" class="btn" id="pDocLinkBtn" style="flex-shrink:0">연결</button>
      </div>
      <div id="pDocNewForm" style="display:none;border:1px dashed var(--c-border);border-radius:var(--radius-sm);padding:10px;margin-top:6px">
        <div class="form-group" style="margin-bottom:8px">
          <div class="doc-type-toggle">
            <button type="button" class="btn active" id="pDocTypeFile" data-type="file">📎 자료</button>
            <button type="button" class="btn" id="pDocTypeMail" data-type="mail">📧 메일 링크</button>
          </div>
        </div>
        <div class="form-group" style="margin-bottom:8px"><input class="form-input" id="pDocNewTitle" placeholder="자료명 (메일 링크는 선택)"></div>
        <div class="form-group" style="margin-bottom:8px"><input class="form-input" id="pDocNewUrl" placeholder="링크 (URL)"></div>
        <div class="form-group" style="margin-bottom:0">
          <div class="thumb-paste-zone" id="pDocNewThumbZone" contenteditable="true" data-placeholder="썸네일 이미지를 복사한 후 여기를 클릭하고 Ctrl+V로 붙여넣기"></div>
          <div id="pDocNewThumbWrap" style="display:none;margin-top:6px;align-items:center;gap:8px">
            <img id="pDocNewThumbImg" style="width:56px;height:56px;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--c-border)" alt="">
            <button type="button" class="btn" id="pDocNewThumbClear" style="font-size:11px;padding:3px 8px">제거</button>
          </div>
        </div>
        <button type="button" class="btn btn-primary" id="pDocNewSave" style="font-size:12px;padding:5px 10px;margin-top:10px">추가</button>
        <button type="button" class="btn" id="pDocNewCancel" style="font-size:12px;padding:5px 10px;margin-top:10px">취소</button>
      </div>
      <button type="button" class="btn" id="pDocAddBtn" style="font-size:12px;padding:5px 10px;margin-top:6px">${ICONS.plus} 새 자료 등록</button>
      <div style="font-size:11px;color:var(--c-text-muted);margin-top:6px">이 프로젝트에 등록된 자료입니다. 코드를 다른 업무/프로젝트에 입력하면 함께 연결해 볼 수 있습니다</div>`,
      `<button class="btn" id="pDocCloseBtn">닫기</button>`);
    document.getElementById('pDocCloseBtn').addEventListener('click', () => {
      closeModal();
      if (currentPage === 'projects') renderProjects();
      else if (currentPage === 'project-detail' && currentCtx) renderProjectDetail(currentCtx);
    });

    let docIdsWorking = project.docIds?.length ? [...project.docIds] : [];
    let expandedId = null;
    function renderList() {
      const wrap = document.getElementById('pDocList');
      const docs = docIdsWorking.map(id => store.documents[id]).filter(Boolean);
      wrap.innerHTML = docs.length === 0 ? '<div style="font-size:12px;color:var(--c-text-muted)">연결된 자료가 없습니다</div>' :
        docs.map(d => `<div style="border:1px solid var(--c-border-light);border-radius:var(--radius-sm);margin-bottom:6px;overflow:hidden">
          <div class="doc-list-item-row" data-id="${d.id}" style="display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer">
            ${docThumbBoxHtml(d, 32)}
            <div style="flex:1;min-width:0">
              <div style="font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.title)}</div>
              <div style="font-size:10.5px;color:var(--c-text-muted);font-family:monospace">코드: ${esc(d.hash||'-')}</div>
            </div>
            ${d.url?`<a href="${esc(d.url)}" target="_blank" rel="noopener" class="btn-icon doc-item-actions" title="열기" onclick="event.stopPropagation()">${d.type==='mail'?ICONS.mail:ICONS.openLink}</a>`:''}
            <button type="button" class="btn-icon btn-danger doc-item-actions pDocRemove" data-id="${d.id}" title="연결 해제">${ICONS.trash}</button>
          </div>
          ${d.id===expandedId?`<div style="background:var(--c-surface-alt);border-top:1px solid var(--c-border-light)">${docDetailExpandedHtml(d, null, project.id)}</div>`:''}
        </div>`).join('');
      wrap.querySelectorAll('.doc-list-item-row[data-id]').forEach(row => row.addEventListener('click', e => {
        if (e.target.closest('.doc-item-actions')) return;
        expandedId = expandedId === row.dataset.id ? null : row.dataset.id;
        renderList();
      }));
      wrap.querySelectorAll('.pDocRemove').forEach(b => b.addEventListener('click', () => {
        docIdsWorking = docIdsWorking.filter(id => id !== b.dataset.id);
        if (expandedId === b.dataset.id) expandedId = null;
        commit();
        renderList();
      }));
      bindDocThumbEditable('#pDocList', () => { commit(); renderList(); });
      bindDocFieldsEditable('#pDocList');
      bindDocLinkedTaskLinks('#pDocList');
      bindDocLinkedProjectLinks('#pDocList');
    }
    function commit() {
      project.docIds = docIdsWorking;
      project.updatedAt = new Date().toISOString();
      saveLS(); saveProjectMeta();
    }
    renderList();
    document.getElementById('pDocLinkBtn').addEventListener('click', () => {
      const inp = document.getElementById('pDocHash');
      if (!inp.value.trim()) return;
      const doc = findDocByHash(inp.value);
      if (!doc) { toast('해당 코드의 자료를 찾을 수 없습니다'); return; }
      if (docIdsWorking.includes(doc.id)) { toast('이미 연결된 자료입니다'); return; }
      docIdsWorking.push(doc.id);
      inp.value = '';
      commit();
      renderList();
      toast('자료가 연결되었습니다');
    });
    let newDocType = 'file';
    const typeFileBtn = document.getElementById('pDocTypeFile');
    const typeMailBtn = document.getElementById('pDocTypeMail');
    typeFileBtn.addEventListener('click', () => { newDocType = 'file'; typeFileBtn.classList.add('active'); typeMailBtn.classList.remove('active'); });
    typeMailBtn.addEventListener('click', () => { newDocType = 'mail'; typeMailBtn.classList.add('active'); typeFileBtn.classList.remove('active'); });
    const newDocThumb = setupThumbPasteZone('pDocNewThumbZone', 'pDocNewThumbWrap', 'pDocNewThumbImg', 'pDocNewThumbClear');
    document.getElementById('pDocAddBtn').addEventListener('click', () => { document.getElementById('pDocNewForm').style.display = ''; });
    document.getElementById('pDocNewCancel').addEventListener('click', () => {
      document.getElementById('pDocNewForm').style.display = 'none';
      document.getElementById('pDocNewTitle').value = '';
      document.getElementById('pDocNewUrl').value = '';
    });
    document.getElementById('pDocNewSave').addEventListener('click', () => {
      const dTitleRaw = document.getElementById('pDocNewTitle').value.trim();
      const dUrl = document.getElementById('pDocNewUrl').value.trim();
      if (newDocType === 'mail' && !dUrl) { toast('메일 링크 URL을 입력하세요'); return; }
      if (newDocType === 'file' && !dTitleRaw) { toast('자료명을 입력하세요'); return; }
      const did = uid();
      store.documents[did] = { id: did, hash: genDocHash(), title: dTitleRaw || (newDocType === 'mail' ? '메일 링크' : ''), type: newDocType, category: '', description: '', url: dUrl, thumbnail: newDocThumb.get(), createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
      saveConfig();
      docIdsWorking.push(did);
      document.getElementById('pDocNewTitle').value = '';
      document.getElementById('pDocNewUrl').value = '';
      document.getElementById('pDocNewForm').style.display = 'none';
      commit();
      renderList();
      toast('자료가 추가되었습니다');
    });
  }

  // ─── PROJECT DETAIL ───
  function renderProjectDetail(pid) {
    const p = store.projects[pid];
    if (!p) { navigateTo('projects'); return; }
    const prog = calcProjectProgress(pid);
    document.getElementById('pageTitle').textContent = p.name;
    document.getElementById('topbarActions').innerHTML = `<button class="btn" id="backBtn">${ICONS.back} 목록으로</button>`;
    document.getElementById('backBtn').addEventListener('click', () => navigateTo('projects'));
    const projTasks = vals('tasks').filter(t => t.projectId === pid);
    const tree = buildTaskTree(projTasks, null, 0);
    const projPurchaseTotal = projTasks.reduce((s, t) => s + getPurchaseTotal(t), 0);
    const projPurchaseSpent = projTasks.reduce((s, t) => s + getPurchaseSpent(t), 0);
    const projMainHtml = `
      <div class="detail-panel">
        <div class="detail-header">
          <div style="display:flex;gap:16px;align-items:center;flex:1;min-width:0">
            ${completionRingHtml(prog, true)}
            <div style="flex:1;min-width:0">
              <div style="font-size:11px;color:var(--c-accent);font-weight:600;margin-bottom:4px">${esc(p.code)}</div>
              <div class="detail-title">${esc(p.name)}</div>
            </div>
          </div>
          <span class="status-badge ${statusClass(p.status)}">${statusLabel(p.status)}</span>
        </div>
        <div class="detail-body">
          ${p.description?`<p style="font-size:13.5px;color:var(--c-text-secondary);margin-bottom:16px;line-height:1.6">${esc(p.description)}</p>`:''}
          <div style="margin-bottom:16px">${progressBarHtml(prog, 'progress-lg')}</div>
          <div class="detail-meta">
            <div><div class="detail-field-label">시작일</div><div class="detail-field-value">${p.startDate||'-'}</div></div>
            <div><div class="detail-field-label">종료일</div><div class="detail-field-value">${p.endDate||'-'}</div></div>
            <div><div class="detail-field-label">전체 업무</div><div class="detail-field-value">${projTasks.length}개 (리프 ${prog.total}개)</div></div>
            <div><div class="detail-field-label">폴더</div><div class="detail-field-value">${p._folder ? '📁 '+esc(p._folder) : '-'}</div></div>
            ${projPurchaseTotal>0?`<div><div class="detail-field-label">🛒 구매 지출액 / 총 예정 금액</div><div class="detail-field-value" style="color:var(--c-primary);font-weight:600">${fmtWon(projPurchaseSpent)} <span style="color:var(--c-text-muted);font-weight:500">/ ${fmtWon(projPurchaseTotal)}</span></div></div>`:''}
          </div>
        </div>
      </div>
      ${renderProjectDocsSectionHtml(p)}
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 16px">
        <div class="section-divider" style="margin:0;flex:1">업무 목록</div>
        <button class="btn btn-primary" id="addTaskForProj" style="flex-shrink:0">${ICONS.plus} 업무 추가</button>
      </div>
      <div class="card"><div id="projTaskList">${tree.length===0?'<div class="empty-state" style="padding:24px"><p>등록된 업무가 없습니다</p></div>':
        renderTaskTreeRows(tree, pid)}</div></div>
    `;
    document.getElementById('pageContent').innerHTML = withDocPane(docPaneTaskId, projMainHtml);
    document.getElementById('addTaskForProj').addEventListener('click', () => showTaskModal(null, pid));
    bindProjectDocsSection(p);
    bindTaskEvents(pid);
    bindDocPaneEvents(docPaneTaskId);
  }

  // ─── TASK TREE RENDERING ───
  // Brief inline detail shown when a task's name is clicked — mirrors the purchase-record expand pattern.
  function taskDetailExpandedHtml(t) {
    const isParent = hasChildren(t.id);
    const prog = isParent ? calcTaskProgress(t.id) : null;
    return `<div style="padding:12px 16px 14px;background:var(--c-surface-alt);border-bottom:1px solid var(--c-border-light)">
      <div class="detail-meta" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">
        ${t.projectName?`<div><div class="detail-field-label">프로젝트</div><div class="detail-field-value">${esc(t.projectName)}</div></div>`:''}
        <div><div class="detail-field-label">담당자</div><div class="detail-field-value">${esc(t.assignee||'-')}</div></div>
        <div><div class="detail-field-label">카테고리</div><div class="detail-field-value">${esc(t.category||'-')}</div></div>
        <div><div class="detail-field-label">우선순위</div><div class="detail-field-value">${esc(t.priority||'-')}</div></div>
        <div><div class="detail-field-label">마감일</div><div class="detail-field-value">${t.dueDate||'-'}</div></div>
        ${prog?`<div><div class="detail-field-label">하위 진행률</div><div class="detail-field-value">${prog.done}/${prog.total} (${prog.pct}%)</div></div>`:''}
      </div>
      ${t.description?`<div style="margin-top:8px;font-size:12px;color:var(--c-text-secondary)">${esc(t.description)}</div>`:''}
      ${t.category==='구매'&&getPurchaseTotal(t)>0?`<div style="margin-top:8px;font-size:12px">🛒 지출 <b style="color:var(--c-primary)">${fmtWon(getPurchaseSpent(t))}</b> / 총 <b>${fmtWon(getPurchaseTotal(t))}</b></div>`:''}
      ${t.category==='회의'&&(t.meetingLocation||t.meetingDate)?`<div style="margin-top:8px;font-size:12px">🗓️ ${esc(t.meetingLocation||'-')} · ${t.meetingDate||'-'}</div>`:''}
      <button type="button" class="btn btn-primary task-detail-edit" data-id="${t.id}" style="margin-top:10px;font-size:12px;padding:6px 12px">${ICONS.edit} 업무 수정</button>
    </div>`;
  }
  function renderTaskTreeRows(tree, ctxPid) {
    let html = `<div class="task-tree-row header-row"><span></span><span>업무명</span><span>카테고리</span><span>마감일</span><span>진척도</span><span>상태</span><span></span></div>`;
    for (const t of tree) {
      const isParent = hasChildren(t.id);
      const prog = isParent ? calcTaskProgress(t.id) : null;
      const indent = Array(t._depth).fill('<span class="task-indent-line"></span>').join('');
      html += `<div class="task-tree-row${t.id===selectedTaskId?' selected':''}" data-id="${t.id}">
        <span><input type="checkbox" class="task-checkbox" ${t.status==='완료'?'checked':''} data-id="${t.id}"></span>
        <span class="task-title-cell">
          <span class="task-indent">${indent}</span>
          <span class="task-title-text" data-id="${t.id}" title="클릭: 간략히 보기 · 더블클릭: 편집">${esc(t.title)}</span>
          ${isParent ? `<span class="task-child-count">${getChildren(t.id).length}</span>` : ''}
        </span>
        <span>${t.category ? `<span class="category-badge">${esc(t.category)}</span>` : ''}</span>
        <span class="task-date">${t.dueDate||'-'}</span>
        <span>${prog ? progressMiniHtml(prog) : (t.category==='구매' && getPurchaseTotal(t)>0 ? `<span style="font-size:11.5px;font-weight:600;color:var(--c-text-secondary)" title="지출액 / 총 구매 금액">${fmtWon(getPurchaseSpent(t))} / ${fmtWon(getPurchaseTotal(t))}</span>` : '')}</span>
        <span class="status-badge ${statusClass(t.status)}">${statusLabel(t.status)}</span>
        <span class="task-actions">
          <button class="btn-icon btn-view-docs view-task-docs" data-id="${t.id}" title="자료 보기">${ICONS.docs}</button>
          <button class="btn-icon add-sub-task" data-id="${t.id}" data-proj="${t.projectId||''}" title="하위업무 추가">${ICONS.sub}</button>
          <button class="btn-icon edit-task" data-id="${t.id}">${ICONS.edit}</button>
          <button class="btn-icon btn-danger del-task" data-id="${t.id}">${ICONS.trash}</button>
        </span>
      </div>`;
      if (t.id === expandedTaskId) html += taskDetailExpandedHtml(t);
    }
    return html;
  }

  function bindTaskEvents(ctxPid) {
    const refresh = () => { if(ctxPid) renderProjectDetail(ctxPid); else renderTasks(); };
    // Row click: select + toggle a brief inline detail (like the purchase history expand)
    document.querySelectorAll('.task-tree-row[data-id]').forEach(row => row.addEventListener('click', e => {
      if (e.target.closest('.task-actions, .task-checkbox')) return;
      selectedTaskId = row.dataset.id;
      expandedTaskId = expandedTaskId === row.dataset.id ? null : row.dataset.id;
      refresh();
    }));
    document.querySelectorAll('.task-detail-edit').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      showTaskModal(store.tasks[b.dataset.id], ctxPid);
    }));
    // Checkbox
    document.querySelectorAll('.task-checkbox').forEach(cb => cb.addEventListener('change', () => {
      const t = store.tasks[cb.dataset.id];
      t.status = cb.checked ? '완료' : '대기';
      t.updatedAt = new Date().toISOString();
      updateParentStatus(cb.dataset.id);
      saveLS(); saveProjectTasks(t.projectId);
      refresh();
    }));
    // Double-click anywhere on the row to edit
    document.querySelectorAll('.task-tree-row[data-id]').forEach(row => row.addEventListener('dblclick', e => {
      if (e.target.closest('.task-actions, .task-checkbox')) return;
      e.preventDefault();
      showTaskModal(store.tasks[row.dataset.id], ctxPid);
    }));
    // Edit button
    document.querySelectorAll('.edit-task').forEach(b => b.addEventListener('click', () => showTaskModal(store.tasks[b.dataset.id], ctxPid)));
    // Sub-task button
    document.querySelectorAll('.add-sub-task').forEach(b => b.addEventListener('click', () => {
      showTaskModal(null, b.dataset.proj || ctxPid, b.dataset.id);
    }));
    // View linked documents (split pane)
    document.querySelectorAll('.view-task-docs').forEach(b => b.addEventListener('click', () => openDocPane(b.dataset.id)));
    // Delete
    document.querySelectorAll('.del-task').forEach(b => b.addEventListener('click', () => {
      const descendants = getDescendantIds(b.dataset.id);
      const msg = descendants.length > 0 ? `이 업무와 하위 업무 ${descendants.length}개를 모두 삭제하시겠습니까?` : '삭제하시겠습니까?';
      if(confirm(msg)){
        const t = store.tasks[b.dataset.id];
        const pid = t?.projectId;
        descendants.forEach(id => delete store.tasks[id]);
        delete store.tasks[b.dataset.id];
        saveLS(); saveProjectTasks(pid);
        refresh(); toast('삭제됨');
      }
    }));
  }

  // ─── TASKS (all) ───
  const PRIORITIES = ['높음', '보통', '낮음'];
  function renderPriorityGroupsHtml(allTasks) {
    const todoLeaves = allTasks.filter(t => !hasChildren(t.id) && t.status !== '완료');
    return PRIORITIES.map(p => {
      const group = todoLeaves.filter(t => (t.priority || '보통') === p)
        .sort((a, b) => (a.dueDate || '9999-99-99').localeCompare(b.dueDate || '9999-99-99'))
        .map(t => ({ ...t, _depth: 0 }));
      return `<div class="section-divider">${p} 우선순위 <span style="font-weight:400;color:var(--c-text-muted)">${group.length}건</span></div>
        <div class="card"><div>${group.length === 0 ? '<div class="empty-state" style="padding:20px"><p>해당 업무가 없습니다</p></div>' :
          renderTaskTreeRows(group, null)}</div></div>`;
    }).join('');
  }
  function renderTasks(filter) {
    filter = filter || 'all';
    const all = vals('tasks');
    let bodyHtml;
    if (filter === 'priority') {
      bodyHtml = renderPriorityGroupsHtml(all);
    } else {
      let filtered;
      if (filter === 'all') filtered = all;
      else if (CATEGORIES.includes(filter)) filtered = all.filter(t => t.category === filter);
      else filtered = all.filter(t => t.status === filter);

      const filteredIds = new Set(filtered.map(t => t.id));
      const adjustedTasks = filtered.map(t => (t.parentTaskId && !filteredIds.has(t.parentTaskId)) ? { ...t, parentTaskId: null } : t);
      const finalTree = buildTaskTree(adjustedTasks, null, 0);
      bodyHtml = `<div class="card"><div id="allTaskList">${finalTree.length===0?'<div class="empty-state" style="padding:24px"><p>해당 업무가 없습니다</p></div>':
        renderTaskTreeRows(finalTree, null)}</div></div>`;
      const purchaseTotal = filtered.reduce((s, t) => s + getPurchaseTotal(t), 0);
      const purchaseSpent = filtered.reduce((s, t) => s + getPurchaseSpent(t), 0);
      if (purchaseTotal > 0) {
        bodyHtml = `<div class="card" style="margin-bottom:14px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
          <span style="font-size:13px;font-weight:600;color:var(--c-text-secondary)">🛒 구매 지출액 / 총 예정 금액</span>
          <span style="font-size:18px;font-weight:700;color:var(--c-primary)">${fmtWon(purchaseSpent)} <span style="font-size:13px;font-weight:500;color:var(--c-text-muted)">/ ${fmtWon(purchaseTotal)}</span></span>
        </div>` + bodyHtml;
      }
    }

    const tasksMainHtml = `
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px">
        <div class="tab-bar" id="taskTabs" style="flex:1;min-width:220px;margin-bottom:0">
          <button class="tab-item ${filter==='all'?'active':''}" data-filter="all">전체</button>
          <button class="tab-item ${filter==='대기'?'active':''}" data-filter="대기">대기</button>
          <button class="tab-item ${filter==='진행중'?'active':''}" data-filter="진행중">진행중</button>
          <button class="tab-item ${filter==='완료'?'active':''}" data-filter="완료">완료</button>
          <span style="width:1px;background:var(--c-border-light);margin:4px 6px"></span>
          ${CATEGORIES.map(c => `<button class="tab-item ${filter===c?'active':''}" data-filter="${c}">${c}</button>`).join('')}
          <span style="width:1px;background:var(--c-border-light);margin:4px 6px"></span>
          <button class="tab-item ${filter==='priority'?'active':''}" data-filter="priority">우선순위별</button>
        </div>
        <button class="btn btn-primary" id="addTaskBtn" style="flex-shrink:0">${ICONS.plus} 업무 추가</button>
      </div>
      ${bodyHtml}
    `;
    document.getElementById('pageContent').innerHTML = withDocPane(docPaneTaskId, tasksMainHtml);
    document.getElementById('addTaskBtn').addEventListener('click', () => showTaskModal());
    document.getElementById('taskTabs').addEventListener('click', e => { const tab = e.target.closest('.tab-item'); if(tab) renderTasks(tab.dataset.filter); });
    bindTaskEvents(null);
    bindDocPaneEvents(docPaneTaskId);
  }

  function showTaskModal(ex, defProjId, defParentId, defGoalId) {
    const isEdit = !!ex;
    const projects = vals('projects');
    const goals = vals('goals');
    const allTasks = vals('tasks');
    const projOpts = projects.map(p => `<option value="${p.id}" ${(ex?.projectId||defProjId)===p.id?'selected':''}>${esc(p.code?p.code+' ':'')}${esc(p.name)}</option>`).join('');
    const goalOpts = goals.map(g => `<option value="${g.id}" ${(ex?.goalId||defGoalId)===g.id?'selected':''}>${g.year?esc('['+g.year+'] '):''}${esc(g.title)}</option>`).join('');
    const catOpts = CATEGORIES.map(c => `<option value="${c}" ${ex?.category===c?'selected':''}>${c}</option>`).join('');

    const excludeIds = new Set();
    if (ex) { excludeIds.add(ex.id); getDescendantIds(ex.id).forEach(id => excludeIds.add(id)); }

    openModal(isEdit?'업무 수정':'업무 추가', `
      <div class="form-group"><label class="form-label">업무명 *</label><input class="form-input" id="mTaskTitle" value="${esc(ex?.title||'')}"></div>
      <div class="form-group"><label class="form-label">프로젝트</label><select class="form-select" id="mTaskProj"><option value="">— 선택 —</option>${projOpts}</select></div>
      <div class="form-group"><label class="form-label">연간 목표 (선택)</label><select class="form-select" id="mTaskGoal"><option value="">— 없음 —</option>${goalOpts}</select></div>
      <div class="form-group"><label class="form-label">상위 업무</label><select class="form-select" id="mTaskParent"><option value="">— 없음 (최상위) —</option></select><div style="font-size:11px;color:var(--c-text-muted);margin-top:3px">같은 프로젝트의 업무만 상위로 선택 가능</div></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group"><label class="form-label">카테고리</label><select class="form-select" id="mTaskCat"><option value="">— 선택 —</option>${catOpts}</select></div>
        <div class="form-group"><label class="form-label">담당자</label><input class="form-input" id="mTaskAssignee" value="${esc(ex?.assignee||'')}"></div>
      </div>
      <div class="form-group" id="mTaskMeetingFields" style="display:none">
        <label class="form-label">🗓️ 회의 정보</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <input class="form-input" id="mTaskMeetingLocation" placeholder="회의 장소" value="${esc(ex?.meetingLocation||'')}">
          <input class="form-input" id="mTaskMeetingDate" type="date" value="${ex?.meetingDate||''}">
        </div>
        <div style="font-size:11px;color:var(--c-text-muted);margin-top:5px">회의 결과에 따른 회의록 파일은 아래 "관련 자료"에서 추가하세요 (회의록으로 자동 분류됩니다)</div>
      </div>
      <div class="form-group" id="mTaskPurchaseFields" style="display:none">
        <label class="form-label">🛒 구매 물품 목록</label>
        <div id="mTaskPurchaseList" style="margin-bottom:8px"></div>
        <div style="display:flex;gap:6px">
          <input class="form-input" id="mTaskPurchaseItemName" placeholder="품목명" style="flex:2">
          <input class="form-input" id="mTaskPurchaseItemAmount" type="number" placeholder="금액" style="flex:1">
          <button type="button" class="btn" id="mTaskPurchaseAddBtn" style="flex-shrink:0">추가</button>
        </div>
        <div style="margin-top:8px;font-size:13px;font-weight:600;text-align:right;color:var(--c-primary)">지출액 / 총 구매 금액: <span id="mTaskPurchaseTotal">0원 / 0원</span></div>
      </div>
      <div class="form-group"><label class="form-label">설명</label><textarea class="form-textarea" id="mTaskDesc">${esc(ex?.description||'')}</textarea></div>
      <div class="form-group">
        <label class="form-label">📎 관련 자료</label>
        <div id="mTaskDocList" style="margin-bottom:8px"></div>
        <div style="display:flex;gap:6px;margin-bottom:6px">
          <input class="form-input" id="mTaskDocHash" placeholder="다른 프로젝트 자료 연결 코드 입력 (예: 3F9K2A)" style="flex:1">
          <button type="button" class="btn" id="mTaskDocLinkBtn" style="flex-shrink:0">연결</button>
        </div>
        <div id="mTaskDocNewForm" style="display:none;border:1px dashed var(--c-border);border-radius:var(--radius-sm);padding:10px;margin-top:6px">
          <div class="form-group" style="margin-bottom:8px">
            <div class="doc-type-toggle">
              <button type="button" class="btn active" id="mTaskDocTypeFile" data-type="file">📎 자료</button>
              <button type="button" class="btn" id="mTaskDocTypeMail" data-type="mail">📧 메일 링크</button>
            </div>
          </div>
          <div class="form-group" style="margin-bottom:8px"><input class="form-input" id="mTaskDocNewTitle" placeholder="자료명 (메일 링크는 선택)"></div>
          <div class="form-group" style="margin-bottom:8px"><input class="form-input" id="mTaskDocNewUrl" placeholder="링크 (URL)"></div>
          <div class="form-group" style="margin-bottom:0">
            <div class="thumb-paste-zone" id="mTaskDocNewThumbZone" contenteditable="true" data-placeholder="썸네일 이미지를 복사한 후 여기를 클릭하고 Ctrl+V로 붙여넣기"></div>
            <div id="mTaskDocNewThumbWrap" style="display:none;margin-top:6px;align-items:center;gap:8px">
              <img id="mTaskDocNewThumbImg" style="width:56px;height:56px;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--c-border)" alt="">
              <button type="button" class="btn" id="mTaskDocNewThumbClear" style="font-size:11px;padding:3px 8px">제거</button>
            </div>
          </div>
          <button type="button" class="btn btn-primary" id="mTaskDocNewSave" style="font-size:12px;padding:5px 10px;margin-top:10px">추가</button>
          <button type="button" class="btn" id="mTaskDocNewCancel" style="font-size:12px;padding:5px 10px;margin-top:10px">취소</button>
        </div>
        <button type="button" class="btn" id="mTaskDocAddBtn" style="font-size:12px;padding:5px 10px">${ICONS.plus} 새 자료 등록</button>
        <div style="font-size:11px;color:var(--c-text-muted);margin-top:6px">메일 링크도 자료로 함께 등록해 관리할 수 있습니다. 등록 시 생성되는 코드를 다른 업무(다른 프로젝트 포함)에 입력하면 같은 자료를 연결해 볼 수 있습니다</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group"><label class="form-label">마감일</label><input class="form-input" id="mTaskDue" type="date" value="${ex?.dueDate||''}"></div>
        <div class="form-group"><label class="form-label">우선순위</label><select class="form-select" id="mTaskPriority"><option value="보통" ${ex?.priority==='보통'?'selected':''}>보통</option><option value="높음" ${ex?.priority==='높음'?'selected':''}>높음</option><option value="낮음" ${ex?.priority==='낮음'?'selected':''}>낮음</option></select></div>
      </div>
      <div class="form-group"><label class="form-label">상태</label><select class="form-select" id="mTaskStatus"><option value="대기" ${ex?.status==='대기'?'selected':''}>대기</option><option value="진행중" ${ex?.status==='진행중'?'selected':''}>진행중</option><option value="완료" ${ex?.status==='완료'?'selected':''}>완료</option></select></div>
      ${isEdit?`<div class="form-group"><label class="form-label">업무 코드</label><div style="font-family:monospace;font-size:13px;padding:8px 12px;background:var(--c-surface-alt);border-radius:var(--radius-sm)">${esc(ex.hash||'-')}</div></div>`:''}`,
      `<button class="btn" onclick="document.getElementById('modalOverlay').hidden=true">취소</button><button class="btn btn-primary" id="mTaskSave">${isEdit?'수정':'추가'}</button>`);

    function updateParentOptions() {
      const projId = document.getElementById('mTaskProj').value;
      const parentSel = document.getElementById('mTaskParent');
      parentSel.innerHTML = '<option value="">— 없음 (최상위) —</option>';
      if (projId) {
        const projTasks = allTasks.filter(t => t.projectId === projId && !excludeIds.has(t.id));
        const tree = buildTaskTree(projTasks, null, 0);
        tree.forEach(t => {
          const opt = document.createElement('option');
          opt.value = t.id;
          opt.textContent = '  '.repeat(t._depth) + (t._depth > 0 ? '└ ' : '') + t.title;
          if ((ex?.parentTaskId || defParentId) === t.id) opt.selected = true;
          parentSel.appendChild(opt);
        });
      }
    }
    document.getElementById('mTaskProj').addEventListener('change', updateParentOptions);
    updateParentOptions();

    // Category-specific fields: meeting info / purchase item list
    function updateCategoryFields() {
      const cat = document.getElementById('mTaskCat').value;
      document.getElementById('mTaskMeetingFields').style.display = cat === '회의' ? '' : 'none';
      document.getElementById('mTaskPurchaseFields').style.display = cat === '구매' ? '' : 'none';
    }
    document.getElementById('mTaskCat').addEventListener('change', updateCategoryFields);
    updateCategoryFields();

    let purchaseItemsWorking = ex?.purchaseItems?.length ? ex.purchaseItems.map(it => ({ ...it })) : [];
    function updatePurchaseTotalDisplay() {
      const total = purchaseItemsWorking.reduce((s, it) => s + (Number(it.amount) || 0), 0);
      const spent = purchaseItemsWorking.filter(it => it.purchased).reduce((s, it) => s + (Number(it.amount) || 0), 0);
      document.getElementById('mTaskPurchaseTotal').textContent = `${spent.toLocaleString()}원 / ${total.toLocaleString()}원`;
    }
    function renderPurchaseItems() {
      const wrap = document.getElementById('mTaskPurchaseList');
      wrap.innerHTML = purchaseItemsWorking.length === 0 ? '<div style="font-size:12px;color:var(--c-text-muted)">등록된 품목이 없습니다</div>' :
        purchaseItemsWorking.map((it, idx) => `<div style="display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--c-border-light);border-radius:var(--radius-sm);margin-bottom:5px;flex-wrap:wrap">
          <button type="button" class="purchase-status-btn ${it.purchased?'done':''} mTaskPurchaseToggle" data-idx="${idx}">${it.purchased?'구매완료':'미구매'}</button>
          ${it.purchased?`<input type="date" class="form-input mTaskPurchaseDateInput" data-idx="${idx}" value="${it.purchasedAt||''}" title="구매일" style="width:130px;font-size:11.5px;padding:5px 6px">`:''}
          <input class="form-input mTaskPurchaseNameInput" data-idx="${idx}" value="${esc(it.name)}" placeholder="품명" style="flex:1;min-width:100px;font-size:12.5px;padding:5px 8px">
          <input class="form-input mTaskPurchaseAmountInput" data-idx="${idx}" type="number" value="${it.amount||0}" placeholder="금액" style="width:110px;font-size:12.5px;padding:5px 8px;text-align:right">
          <button type="button" class="btn-icon btn-danger mTaskPurchaseRemove" data-idx="${idx}" title="삭제">${ICONS.trash}</button>
        </div>`).join('');
      wrap.querySelectorAll('.mTaskPurchaseToggle').forEach(b => b.addEventListener('click', () => {
        const it = purchaseItemsWorking[+b.dataset.idx];
        it.purchased = !it.purchased;
        if (it.purchased && !it.purchasedAt) it.purchasedAt = new Date().toISOString().slice(0, 10);
        renderPurchaseItems();
      }));
      wrap.querySelectorAll('.mTaskPurchaseDateInput').forEach(inp => inp.addEventListener('change', () => { purchaseItemsWorking[+inp.dataset.idx].purchasedAt = inp.value; }));
      wrap.querySelectorAll('.mTaskPurchaseRemove').forEach(b => b.addEventListener('click', () => { purchaseItemsWorking.splice(+b.dataset.idx, 1); renderPurchaseItems(); }));
      wrap.querySelectorAll('.mTaskPurchaseNameInput').forEach(inp => inp.addEventListener('input', () => { purchaseItemsWorking[+inp.dataset.idx].name = inp.value; }));
      wrap.querySelectorAll('.mTaskPurchaseAmountInput').forEach(inp => inp.addEventListener('input', () => {
        purchaseItemsWorking[+inp.dataset.idx].amount = Number(inp.value) || 0;
        updatePurchaseTotalDisplay();
      }));
      updatePurchaseTotalDisplay();
    }
    renderPurchaseItems();
    document.getElementById('mTaskPurchaseAddBtn').addEventListener('click', () => {
      const nameInp = document.getElementById('mTaskPurchaseItemName');
      const amtInp = document.getElementById('mTaskPurchaseItemAmount');
      const name = nameInp.value.trim();
      if (!name) { toast('품목명을 입력하세요'); return; }
      purchaseItemsWorking.push({ id: uid(), name, amount: Number(amtInp.value) || 0, purchased: false });
      nameInp.value = ''; amtInp.value = '';
      renderPurchaseItems();
      nameInp.focus();
    });

    // Related documents (many-to-many via hash code) — includes mail links as a document type
    let docIdsWorking = ex?.docIds?.length ? [...ex.docIds] : [];
    let expandedDocId = null;
    function renderTaskDocRows() {
      const wrap = document.getElementById('mTaskDocList');
      const docs = docIdsWorking.map(did => store.documents[did]).filter(Boolean);
      wrap.innerHTML = docs.length === 0 ? '<div style="font-size:12px;color:var(--c-text-muted)">연결된 자료가 없습니다</div>' :
        docs.map(d => `<div style="border:1px solid var(--c-border-light);border-radius:var(--radius-sm);margin-bottom:6px;overflow:hidden">
          <div class="doc-list-item-row" data-id="${d.id}" style="display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer">
            ${docThumbBoxHtml(d, 32)}
            <div style="flex:1;min-width:0">
              <div style="font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.title)}</div>
              <div style="font-size:10.5px;color:var(--c-text-muted);font-family:monospace">코드: ${esc(d.hash||'-')}</div>
            </div>
            ${d.url?`<a href="${esc(d.url)}" target="_blank" rel="noopener" class="btn-icon doc-item-actions" title="열기" onclick="event.stopPropagation()">${d.type==='mail'?ICONS.mail:ICONS.openLink}</a>`:''}
            <button type="button" class="btn-icon btn-danger doc-item-actions mTaskDocRemove" data-id="${d.id}" title="연결 해제">${ICONS.trash}</button>
          </div>
          ${d.id===expandedDocId?`<div style="background:var(--c-surface-alt);border-top:1px solid var(--c-border-light)">${docDetailExpandedHtml(d, ex?.id)}</div>`:''}
        </div>`).join('');
      wrap.querySelectorAll('.doc-list-item-row[data-id]').forEach(row => row.addEventListener('click', e => {
        if (e.target.closest('.doc-item-actions')) return;
        expandedDocId = expandedDocId === row.dataset.id ? null : row.dataset.id;
        renderTaskDocRows();
      }));
      wrap.querySelectorAll('.mTaskDocRemove').forEach(b => b.addEventListener('click', () => {
        docIdsWorking = docIdsWorking.filter(did => did !== b.dataset.id);
        if (expandedDocId === b.dataset.id) expandedDocId = null;
        renderTaskDocRows();
      }));
      bindDocThumbEditable('#mTaskDocList', renderTaskDocRows);
      bindDocFieldsEditable('#mTaskDocList');
      bindDocLinkedTaskLinks('#mTaskDocList');
      bindDocLinkedProjectLinks('#mTaskDocList');
    }
    renderTaskDocRows();
    document.getElementById('mTaskDocLinkBtn').addEventListener('click', () => {
      const hashInput = document.getElementById('mTaskDocHash');
      if (!hashInput.value.trim()) return;
      const doc = findDocByHash(hashInput.value);
      if (!doc) { toast('해당 코드의 자료를 찾을 수 없습니다'); return; }
      if (docIdsWorking.includes(doc.id)) { toast('이미 연결된 자료입니다'); return; }
      docIdsWorking.push(doc.id);
      hashInput.value = '';
      renderTaskDocRows();
      toast('자료가 연결되었습니다');
    });
    let newDocType = 'file';
    const typeFileBtn = document.getElementById('mTaskDocTypeFile');
    const typeMailBtn = document.getElementById('mTaskDocTypeMail');
    typeFileBtn.addEventListener('click', () => { newDocType = 'file'; typeFileBtn.classList.add('active'); typeMailBtn.classList.remove('active'); });
    typeMailBtn.addEventListener('click', () => { newDocType = 'mail'; typeMailBtn.classList.add('active'); typeFileBtn.classList.remove('active'); });
    const newDocThumb = setupThumbPasteZone('mTaskDocNewThumbZone', 'mTaskDocNewThumbWrap', 'mTaskDocNewThumbImg', 'mTaskDocNewThumbClear');
    document.getElementById('mTaskDocAddBtn').addEventListener('click', () => { document.getElementById('mTaskDocNewForm').style.display = ''; });
    document.getElementById('mTaskDocNewCancel').addEventListener('click', () => {
      document.getElementById('mTaskDocNewForm').style.display = 'none';
      document.getElementById('mTaskDocNewTitle').value = '';
      document.getElementById('mTaskDocNewUrl').value = '';
    });
    document.getElementById('mTaskDocNewSave').addEventListener('click', () => {
      const dTitleRaw = document.getElementById('mTaskDocNewTitle').value.trim();
      const dUrl = document.getElementById('mTaskDocNewUrl').value.trim();
      if (newDocType === 'mail' && !dUrl) { toast('메일 링크 URL을 입력하세요'); return; }
      if (newDocType === 'file' && !dTitleRaw) { toast('자료명을 입력하세요'); return; }
      const did = uid();
      const autoCategory = document.getElementById('mTaskCat').value === '회의' ? '회의록' : '';
      store.documents[did] = { id: did, hash: genDocHash(), title: dTitleRaw || (newDocType === 'mail' ? '메일 링크' : ''), type: newDocType, category: autoCategory, description: '', url: dUrl, thumbnail: newDocThumb.get(), createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
      saveConfig();
      docIdsWorking.push(did);
      document.getElementById('mTaskDocNewTitle').value = '';
      document.getElementById('mTaskDocNewUrl').value = '';
      document.getElementById('mTaskDocNewForm').style.display = 'none';
      renderTaskDocRows();
      toast('자료가 추가되었습니다');
    });

    document.getElementById('mTaskSave').addEventListener('click', () => {
      const title = document.getElementById('mTaskTitle').value.trim(); if (!title) { toast('업무명을 입력하세요'); return; }
      const projId = document.getElementById('mTaskProj').value;
      const proj = projects.find(p => p.id === projId);
      const goalId = document.getElementById('mTaskGoal').value || '';
      const goal = goals.find(g => g.id === goalId);
      const parentId = document.getElementById('mTaskParent').value || null;
      const id = ex?.id || uid();
      const oldProjId = ex?.projectId;
      store.tasks[id] = {
        id, title,
        hash: ex?.hash || genTaskHash(),
        description: document.getElementById('mTaskDesc').value.trim(),
        projectId: projId, projectName: proj?.name||'',
        goalId, goalTitle: goal?.title || '',
        parentTaskId: parentId,
        category: document.getElementById('mTaskCat').value,
        assignee: document.getElementById('mTaskAssignee').value.trim(),
        dueDate: document.getElementById('mTaskDue').value,
        priority: document.getElementById('mTaskPriority').value,
        status: document.getElementById('mTaskStatus').value,
        meetingLocation: document.getElementById('mTaskMeetingLocation').value.trim(),
        meetingDate: document.getElementById('mTaskMeetingDate').value,
        purchaseItems: purchaseItemsWorking,
        docIds: docIdsWorking,
        createdAt: ex?.createdAt||new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
      if (parentId) updateParentStatus(id);
      saveLS();
      // Save to appropriate project folder(s)
      saveProjectTasks(projId);
      if (oldProjId && oldProjId !== projId) saveProjectTasks(oldProjId);
      closeModal();
      if (defProjId) renderProjectDetail(defProjId);
      else if (currentPage === 'project-detail' && currentCtx) renderProjectDetail(currentCtx);
      else if (currentPage === 'purchases') renderPurchaseManagement();
      else if (currentPage === 'goals') renderGoals();
      else renderTasks();
      toast(isEdit?'수정됨':'추가됨');
    });
  }

  function defaultPurchaseFilter() {
    const r = purchaseQuickRange('month');
    return { start: r.start, end: r.end, projectId: '', tab: 'history', calMonth: r.start.slice(0,7), calSelectedDate: '', pendingExpandedId: '' };
  }
  function purchaseQuickRange(kind) {
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    if (kind === 'all') return { start: '1970-01-01', end: '9999-12-31' };
    if (kind === 'today') return { start: fmt(now), end: fmt(now) };
    if (kind === 'week') {
      const sunday = new Date(now);
      sunday.setDate(now.getDate() - now.getDay());
      return { start: fmt(sunday), end: fmt(now) };
    }
    return { start: fmt(new Date(now.getFullYear(), now.getMonth(), 1)), end: fmt(now) };
  }
  function getAllPurchaseRecords() {
    const records = [];
    for (const t of vals('tasks')) {
      if (!Array.isArray(t.purchaseItems)) continue;
      for (const it of t.purchaseItems) {
        records.push({
          taskId: t.id, taskTitle: t.title,
          projectId: t.projectId || '', projectName: t.projectName || '(미지정)',
          itemId: it.id, name: it.name, amount: Number(it.amount) || 0,
          purchased: !!it.purchased, purchasedAt: it.purchasedAt || '', dueDate: t.dueDate || ''
        });
      }
    }
    return records;
  }
  function purchaseRecordRowHtml(r, extraMeta) {
    return `<div class="goal-item purchase-record-row" data-task-id="${r.taskId}" style="padding:10px 16px;cursor:pointer">
      <div class="goal-content">
        <div class="goal-title" style="font-size:13px">${esc(r.name)}</div>
        <div style="font-size:11px;color:var(--c-text-muted);margin-top:2px">${esc(r.projectName)} · ${esc(r.taskTitle)}${extraMeta||''}</div>
      </div>
      <div style="font-weight:600;font-variant-numeric:tabular-nums;flex-shrink:0${r.purchased?'':';color:var(--c-warning)'}">${fmtWon(r.amount)}</div>
    </div>`;
  }
  function renderPurchaseHistoryHtml(records) {
    if (records.length === 0) return '<div class="empty-state" style="padding:24px"><p>해당 기간에 집행된 구매 내역이 없습니다</p></div>';
    const sorted = [...records].sort((a, b) => b.purchasedAt.localeCompare(a.purchasedAt));
    const groups = {};
    sorted.forEach(r => { (groups[r.purchasedAt.slice(0,7)] = groups[r.purchasedAt.slice(0,7)] || []).push(r); });
    return Object.keys(groups).sort((a,b) => b.localeCompare(a)).map(month => {
      const items = groups[month];
      const monthTotal = items.reduce((s, r) => s + r.amount, 0);
      return `<div class="section-divider">${month} <span style="font-weight:400;color:var(--c-text-muted)">${fmtWon(monthTotal)}</span></div>
        <div class="card"><div>${items.map(r => purchaseRecordRowHtml(r, ' · ' + r.purchasedAt)).join('')}</div></div>`;
    }).join('');
  }
  function renderPurchasePendingHtml(records) {
    if (records.length === 0) return '<div class="empty-state" style="padding:24px"><p>미집행 구매 내역이 없습니다</p></div>';

    return `<div class="card"><div>${sorted.map(r => {
      const t = store.tasks[r.taskId];
      const expanded = purchaseFilter.pendingExpandedId === r.itemId;

  function renderPurchaseByProjectHtml(records) {
    if (records.length === 0) return '<div class="empty-state" style="padding:24px"><p>구매 내역이 없습니다</p></div>';
    const byProj = {};
    records.forEach(r => {
      const key = r.projectId || '_none';
      if (!byProj[key]) byProj[key] = { id: r.projectId, name: r.projectName, total: 0, spent: 0, pending: 0 };
      byProj[key].total += r.amount;
      if (r.purchased) byProj[key].spent += r.amount; else byProj[key].pending += r.amount;
    });
    const rows = Object.values(byProj).sort((a, b) => b.total - a.total);
    return `<div class="card"><div>${rows.map(r => {
      const pct = r.total ? Math.round(r.spent / r.total * 100) : 0;
      return `<div class="goal-item purchase-project-row" ${r.id?`data-project-id="${r.id}" style="cursor:pointer"`:''}>
        <div class="goal-content">
          <div class="goal-title" style="font-size:13.5px">${esc(r.name)}</div>
          <div class="progress-wrap" style="max-width:none;margin-top:6px"><div class="progress-bar"><div class="progress-fill${pct>=100?' done':''}" style="width:${pct}%"></div></div><div class="progress-text">${fmtWon(r.spent)} / ${fmtWon(r.total)} 지출 (${pct}%)</div></div>
        </div>
        <div style="text-align:right;flex-shrink:0;font-size:12px;color:var(--c-text-muted);white-space:nowrap">
          <div>지출 <b style="color:var(--c-primary)">${fmtWon(r.spent)}</b></div>
          <div>미집행 <b style="color:var(--c-warning)">${fmtWon(r.pending)}</b></div>
        </div>
      </div>`;
    }).join('')}</div></div>`;
  }
  function renderPurchaseCalendarHtml(records, calMonth) {
    const purchased = records.filter(r => r.purchased && r.purchasedAt && r.purchasedAt.slice(0,7) === calMonth);
    const byDay = {};
    purchased.forEach(r => {
      if (!byDay[r.purchasedAt]) byDay[r.purchasedAt] = { total: 0, items: [] };
      byDay[r.purchasedAt].total += r.amount;
      byDay[r.purchasedAt].items.push(r);
    });
    const [y, m] = calMonth.split('-').map(Number);
    const startWeekday = new Date(y, m - 1, 1).getDay();
    const daysInMonth = new Date(y, m, 0).getDate();
    const todayStr = new Date().toISOString().slice(0, 10);
    const pad = n => String(n).padStart(2, '0');
    let cells = '';
    for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-cell empty"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${y}-${pad(m)}-${pad(d)}`;
      const info = byDay[dateStr];
      cells += `<div class="cal-cell${dateStr===todayStr?' today':''}${info?' has-data':''}${dateStr===purchaseFilter.calSelectedDate?' selected':''}" data-date="${dateStr}">
        <div class="cal-day-num">${d}</div>
        ${info ? `<div class="cal-day-total">${fmtWon(info.total)}</div><div class="cal-day-count">${info.items.length}건</div>` : ''}
      </div>`;
    }
    const trailing = (7 - ((startWeekday + daysInMonth) % 7)) % 7;
    for (let i = 0; i < trailing; i++) cells += `<div class="cal-cell empty"></div>`;
    const monthTotal = purchased.reduce((s, r) => s + r.amount, 0);
    const selectedDay = purchaseFilter.calSelectedDate ? byDay[purchaseFilter.calSelectedDate] : null;
    return `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <button class="btn-icon" id="calPrevBtn" title="이전 달">${ICONS.back}</button>
        <div style="font-size:15px;font-weight:600">${calMonth} <span style="font-size:12px;font-weight:400;color:var(--c-text-muted)">· 총 ${fmtWon(monthTotal)}</span></div>
        <button class="btn-icon" id="calNextBtn" title="다음 달" style="transform:scaleX(-1)">${ICONS.back}</button>
      </div>
      <div class="cal-grid cal-header">${['일','월','화','수','목','금','토'].map(d => `<div class="cal-cell-header">${d}</div>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
      ${selectedDay ? `<div class="section-divider">${purchaseFilter.calSelectedDate} 구매 내역</div><div class="card"><div>${selectedDay.items.map(r => purchaseRecordRowHtml(r)).join('')}</div></div>` : ''}
    `;
  }
  function renderPurchaseManagement() {

    const periodTotal = periodRecords.reduce((s, r) => s + r.amount, 0);

        <div class="stat-tile purchase-stat-tile" data-tab="calendar" style="cursor:pointer"><div class="stat-label">기간 내 집행 건수</div><div class="stat-value">${periodRecords.length}건</div></div>
        <div class="stat-tile purchase-stat-tile" data-tab="pending" style="cursor:pointer"><div class="stat-label">전체 미집행 금액</div><div class="stat-value" style="color:var(--c-warning)">${fmtWon(pendingTotal)}</div></div>
        <div class="stat-tile purchase-stat-tile" data-tab="pending" style="cursor:pointer"><div class="stat-label">전체 미집행 건수</div><div class="stat-value" style="color:var(--c-warning)">${pendingAll.length}건</div></div>
      </div>
      <div class="tab-bar" id="purchTabs">
        <button class="tab-item ${tab==='history'?'active':''}" data-tab="history">구매 내역</button>
        <button class="tab-item ${tab==='calendar'?'active':''}" data-tab="calendar">달력</button>
        <button class="tab-item ${tab==='pending'?'active':''}" data-tab="pending">미집행 내역</button>

      </div>
      <div id="purchTabContent">${tabHtml}</div>
    `;
    document.getElementById('purchStart').addEventListener('change', e => { purchaseFilter.start = e.target.value; renderPurchaseManagement(); });
    document.getElementById('purchEnd').addEventListener('change', e => { purchaseFilter.end = e.target.value; renderPurchaseManagement(); });
    document.getElementById('purchProject').addEventListener('change', e => { purchaseFilter.projectId = e.target.value; renderPurchaseManagement(); });
    document.getElementById('purchQuickRangeBtns').addEventListener('click', e => {
      const b = e.target.closest('[data-range]');
      if (!b) return;
      const r = purchaseQuickRange(b.dataset.range);
      purchaseFilter.start = r.start; purchaseFilter.end = r.end;
      renderPurchaseManagement();
    });
    document.getElementById('purchTabs').addEventListener('click', e => {
      const b = e.target.closest('.tab-item');
      if (b) { purchaseFilter.tab = b.dataset.tab; renderPurchaseManagement(); }
    });
    document.querySelectorAll('.purchase-stat-tile[data-tab]').forEach(tile => tile.addEventListener('click', () => {
      purchaseFilter.tab = tile.dataset.tab;
      if (tile.dataset.tab === 'calendar') {
        purchaseFilter.calMonth = purchaseFilter.start > '1970-01-01' ? purchaseFilter.start.slice(0, 7) : purchaseQuickRange('month').start.slice(0, 7);
        purchaseFilter.calSelectedDate = '';
      }

    document.querySelectorAll('.purchase-record-row[data-task-id]').forEach(row => row.addEventListener('click', () => showTaskModal(store.tasks[row.dataset.taskId])));
    document.querySelectorAll('.purchase-project-row[data-project-id]').forEach(row => row.addEventListener('click', () => navigateTo('project-detail', row.dataset.projectId)));

      if (e.target.closest('.purchase-pending-edit')) return;
      purchaseFilter.pendingExpandedId = purchaseFilter.pendingExpandedId === row.dataset.itemId ? '' : row.dataset.itemId;
      renderPurchaseManagement();
    }));
    document.querySelectorAll('.purchase-pending-edit').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); showTaskModal(store.tasks[b.dataset.taskId]); }));
    const calPrevBtn = document.getElementById('calPrevBtn');
    const calNextBtn = document.getElementById('calNextBtn');
    if (calPrevBtn) calPrevBtn.addEventListener('click', () => { shiftCalMonth(-1); renderPurchaseManagement(); });
    if (calNextBtn) calNextBtn.addEventListener('click', () => { shiftCalMonth(1); renderPurchaseManagement(); });
    document.querySelectorAll('.cal-cell.has-data[data-date]').forEach(cell => cell.addEventListener('click', () => {
      purchaseFilter.calSelectedDate = purchaseFilter.calSelectedDate === cell.dataset.date ? '' : cell.dataset.date;
      renderPurchaseManagement();
    }));

  function shiftCalMonth(delta) {
    const [y, m] = purchaseFilter.calMonth.split('-').map(Number);

      </div>
      <div class="form-group"><label class="form-label">자료명 (메일 링크는 선택)</label><input class="form-input" id="mDocTitle" value="${esc(ex?.title||'')}"></div>
      <div class="form-group"><label class="form-label">분류</label><select class="form-select" id="mDocCat"><option value="">— 선택 —</option><option value="설계문서" ${ex?.category==='설계문서'?'selected':''}>설계문서</option><option value="시험성적서" ${ex?.category==='시험성적서'?'selected':''}>시험성적서</option><option value="회의록" ${ex?.category==='회의록'?'selected':''}>회의록</option><option value="제안서" ${ex?.category==='제안서'?'selected':''}>제안서</option><option value="보고서" ${ex?.category==='보고서'?'selected':''}>보고서</option><option value="기타" ${ex?.category==='기타'?'selected':''}>기타</option></select></div>
      <div class="form-group"><label class="form-label">설명 / 메모</label><textarea class="form-textarea" id="mDocDesc">${esc(ex?.description||'')}</textarea></div>
      <div class="form-group"><label class="form-label">링크 (URL)</label><input class="form-input" id="mDocUrl" placeholder="https://..." value="${esc(ex?.url||'')}"></div>
      <div class="form-group">
        <label class="form-label">썸네일 이미지</label>
        <div class="thumb-paste-zone" id="mDocThumbZone" contenteditable="true" data-placeholder="썸네일 이미지를 복사한 후 여기를 클릭하고 Ctrl+V로 붙여넣기"></div>
        <div id="mDocThumbWrap" style="display:none;margin-top:6px;align-items:center;gap:8px">
          <img id="mDocThumbImg" style="width:64px;height:64px;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--c-border)" alt="">
          <button type="button" class="btn" id="mDocThumbClear" style="font-size:11px;padding:3px 8px">제거</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">관련 업무 (선택)</label>
        <div id="mDocTaskList" style="margin-bottom:8px"></div>
        <div style="display:flex;gap:6px">
          <select class="form-select" id="mDocTaskSelect" style="flex:1"><option value="">업무 선택...</option>${taskOpts}</select>
          <button type="button" class="btn" id="mDocTaskAddBtn" style="flex-shrink:0">추가</button>
        </div>
      </div>
      ${isEdit?`<div class="form-group"><label class="form-label">연결 코드</label><div style="font-family:monospace;font-size:13px;padding:8px 12px;background:var(--c-surface-alt);border-radius:var(--radius-sm)">${esc(ex.hash||'-')}</div><div style="font-size:11px;color:var(--c-text-muted);margin-top:3px">이 코드를 다른 업무(다른 프로젝트 포함)에 입력하면 이 자료를 함께 연결해 볼 수 있습니다</div></div>`:''}`,
      `<button class="btn" onclick="document.getElementById('modalOverlay').hidden=true">취소</button><button class="btn btn-primary" id="mDocSave">${isEdit?'수정':'등록'}</button>`);
    let docType = exType;
    const typeFileBtn = document.getElementById('mDocTypeFile');
    const typeMailBtn = document.getElementById('mDocTypeMail');
    typeFileBtn.addEventListener('click', () => { docType = 'file'; typeFileBtn.classList.add('active'); typeMailBtn.classList.remove('active'); });
    typeMailBtn.addEventListener('click', () => { docType = 'mail'; typeMailBtn.classList.add('active'); typeFileBtn.classList.remove('active'); });
    const docThumb = setupThumbPasteZone('mDocThumbZone', 'mDocThumbWrap', 'mDocThumbImg', 'mDocThumbClear', ex?.thumbnail || '');

    // Related tasks (many-to-many): create or edit a document while linking it straight to one or more tasks
    const prevLinkedTaskIds = ex ? getDocLinkedTasks(ex.id).map(t => t.id) : [];
    let docTaskIdsWorking = ex ? [...prevLinkedTaskIds] : (attachTaskId ? [attachTaskId] : []);
    function renderDocTaskChips() {
      const wrap = document.getElementById('mDocTaskList');
      const tasks = docTaskIdsWorking.map(id => store.tasks[id]).filter(Boolean);
      wrap.innerHTML = tasks.length === 0 ? '<div style="font-size:12px;color:var(--c-text-muted)">연결된 업무가 없습니다</div>' :
        tasks.map(t => `<span class="doc-linked-task-link" data-id="${t.id}" style="display:inline-flex;align-items:center;gap:6px;margin:0 6px 6px 0">${t.projectName?esc('['+t.projectName+'] '):''}${esc(t.title)}<button type="button" class="mDocTaskRemove" data-id="${t.id}" style="border:none;background:none;color:inherit;cursor:pointer;font-size:13px;line-height:1;padding:0">&times;</button></span>`).join('');
      wrap.querySelectorAll('.mDocTaskRemove').forEach(b => b.addEventListener('click', () => {
        docTaskIdsWorking = docTaskIdsWorking.filter(id => id !== b.dataset.id);
        renderDocTaskChips();
      }));
    }
    renderDocTaskChips();
    document.getElementById('mDocTaskAddBtn').addEventListener('click', () => {
      const sel = document.getElementById('mDocTaskSelect');
      if (!sel.value) return;
      if (!docTaskIdsWorking.includes(sel.value)) docTaskIdsWorking.push(sel.value);
      sel.value = '';
      renderDocTaskChips();
    });

    document.getElementById('mDocSave').addEventListener('click', () => {
      const titleRaw = document.getElementById('mDocTitle').value.trim();
      const url = document.getElementById('mDocUrl').value.trim();
      if (docType === 'mail' && !url) { toast('메일 링크 URL을 입력하세요'); return; }
      if (docType === 'file' && !titleRaw) { toast('자료명을 입력하세요'); return; }
      const id = ex?.id || uid();
      store.documents[id] = { id, hash: ex?.hash || genDocHash(), title: titleRaw || (docType === 'mail' ? '메일 링크' : ''), type: docType, category: document.getElementById('mDocCat').value, description: document.getElementById('mDocDesc').value.trim(), url, thumbnail: docThumb.get(), createdAt: ex?.createdAt||new Date().toISOString(), updatedAt: new Date().toISOString() };
      const affectedProjectIds = new Set();
      docTaskIdsWorking.forEach(taskId => { attachDocToTask(taskId, id); affectedProjectIds.add(store.tasks[taskId]?.projectId); });
      prevLinkedTaskIds.filter(taskId => !docTaskIdsWorking.includes(taskId)).forEach(taskId => { detachDocFromTask(taskId, id); affectedProjectIds.add(store.tasks[taskId]?.projectId); });
      saveLS(); saveConfig();
      affectedProjectIds.forEach(pid => { if (pid) saveProjectTasks(pid); });
      closeModal(); navigateTo(currentPage, currentCtx); toast(isEdit?'수정됨':'등록됨');
    });
  }

  // ═══════════════════════════════════════════
  //  INIT
  // ═══════════════════════════════════════════
  async function init() {
    // 1. Try localStorage first (instant)
    const lsData = loadLS();
    if (lsData) store = lsData;

    // 2. Try restoring file system
    const fsOk = await restoreFS();
    if (fsOk) {
      const fileData = await loadFromFiles();
      if (fileData && (Object.keys(fileData.projects).length > 0 || Object.keys(fileData.goals).length > 0)) {
        store = fileData;
        saveLS(); // sync LS with file data
      }
    }

    // 3. Seed if empty
    if (Object.keys(store.projects).length === 0) {
      const id1 = uid(), id2 = uid(), g1 = uid();
      store.projects[id1] = {
        id: id1, code: 'PRJ-001', name: '8K 터널 균열관리 촬영 시스템',
        description: '터널균열관리를 위한 8K 고화소 글로벌셔터카메라를 이용한 터널 벽면 영상 촬영장치, 조명 시스템, 저장시스템, 운영시스템 개발',
        status: '진행중', startDate: '2024-01-01', endDate: '', _folder: 'PRJ-001',
        createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
      };
      store.projects[id2] = {
        id: id2, code: 'PRJ-002', name: '고성능 엣지 AI CCTV 개발',
        description: '고성능 엣지 AI기능이 탑재된 CCTV 개발 — 시스템 분석, 솔루션 제안, 시제품 제작, 성능검증, 양산까지',
        status: '진행중', startDate: '2024-03-01', endDate: '', _folder: 'PRJ-002',
        createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
      };
      store.goals[g1] = {
        id: g1, title: '비전솔루션 전문기업 기반 구축',
        description: '미래사회가 필요로 하는 영상정보 생산 제품, 시스템 연결, 인터페이스 장치와 서비스 생산 체계 확립',
        year: new Date().getFullYear(), status: '진행중',
        createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
      };
      saveLS();
      if (rootHandle) await saveAllToFiles();
    }

    // 4. Migrate legacy single-value fields to the new list-based fields
    migrateData();

    navigateTo('dashboard');
  }

  function migrateData() {
    let changed = false;
    for (const p of vals('projects')) {
      if (!Array.isArray(p.docIds)) { p.docIds = []; }
    }
    for (const t of vals('tasks')) {
      if (!t.hash) { t.hash = genTaskHash(); changed = true; }
      if (!Array.isArray(t.docIds)) { t.docIds = []; }
      if (Array.isArray(t.purchaseItems)) {
        t.purchaseItems.forEach(it => {
          if (typeof it.purchased !== 'boolean') { it.purchased = false; changed = true; }
          if (it.purchased && !it.purchasedAt) { it.purchasedAt = (t.updatedAt || new Date().toISOString()).slice(0, 10); changed = true; }
        });
      }
      // Legacy single email link field
      const legacyLinks = t.emailLink ? [t.emailLink] : (Array.isArray(t.emailLinks) ? t.emailLinks : []);
      if (legacyLinks.length) {
        legacyLinks.filter(Boolean).forEach(url => {
          const did = uid();
          store.documents[did] = { id: did, hash: genDocHash(), title: '메일 링크', type: 'mail', category: '', description: '', url, thumbnail: '', createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
          attachDocToTask(t.id, did);
        });
        changed = true;
      }
      delete t.emailLink;
      delete t.emailLinks;
    }
    for (const d of vals('documents')) {
      if (!d.hash) { d.hash = genDocHash(); changed = true; }
      if (!d.type) { d.type = 'file'; changed = true; }
      if (d.taskId) {
        if (store.tasks[d.taskId] && attachDocToTask(d.taskId, d.id)) changed = true;
        delete d.taskId; delete d.taskTitle;
        changed = true;
      }
    }
    if (changed) saveLS();
  }

  init().catch(console.error);
})();
</script>
</body>
</html>
